# Hyprsunset config — blue-light filter
# Editado a mano (no generado por nix) porque ~/.config/hypr/ es symlink
# vía home-manager mkOutOfStoreSymlink. Tras editar, recargar con:
#   systemctl --user restart hyprsunset.service
#
# El schedule auto funciona desde 0.4.0 (0.3.3 agarraba el profile equivocado
# al arrancar). Toggle manual SUPER+CTRL+N sigue disponible; pisa el profile
# hasta la próxima transición.
# OJO: gamma dentro de un profile NO va en escala 0-100 (eso es max-gamma);
# 100 se lee como 10000% y hyprsunset se niega a arrancar.

max-gamma = 100

profile {
    time = 7:00
    identity = true
}

profile {
    time = 20:00
    temperature = 3500
}
